<template id="beat-4-cta-template">
  <div id="beat-4-cta" data-composition-id="beat-4-cta" data-width="1080" data-height="1920">
    <style>
      #beat-4-cta {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0D0E12;
      }
      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 160px 80px;
        position: relative;
        z-index: 10;
        text-align: center;
      }
      .header-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 64px;
        color: #F8F9FA;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        margin-bottom: 60px;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .brand-accent {
        color: #FFE500;
        text-shadow: 0 0 30px rgba(255, 229, 0, 0.4);
      }
      .outro-card {
        width: 100%;
        background: rgba(15, 23, 43, 0.65);
        border: 2px solid rgba(29, 41, 61, 0.55);
        border-radius: 28px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 60px 45px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 50px;
        margin-bottom: 50px;
      }
      .cta-button {
        background: #FFE500;
        color: #0D0E12;
        font-family: 'Outfit', sans-serif;
        font-weight: 900;
        font-size: 36px;
        text-transform: uppercase;
        letter-spacing: -0.01em;
        padding: 24px 50px;
        border-radius: 20px;
        border: none;
        box-shadow: 0 0 35px rgba(255, 229, 0, 0.35);
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .arrow-icon {
        width: 36px;
        height: 36px;
        stroke: #0D0E12;
      }
      .url-display {
        font-family: 'Outfit', sans-serif;
        font-size: 52px;
        font-weight: 900;
        color: #F8F9FA;
        letter-spacing: -0.02em;
        border-bottom: 3px solid #FFE500;
        padding-bottom: 10px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      }
      .glow-ring-large {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: #FFE500;
        filter: blur(200px);
        opacity: 0.07;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
      }
    </style>

    <div class="glow-ring-large" data-layout-allow-overflow></div>
    
    <div class="content" data-layout-allow-overflow>
      <div class="header-text">CYBER-EXPOSURE <span class="brand-accent">SHIELD</span></div>
      
      <div class="outro-card" data-layout-allow-overflow>
        <button class="cta-button">
          <span>Compare eSIM Free</span>
          <!-- Inline robust SVG for arrow icon -->
          <svg class="arrow-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        
        <div class="url-display">esim.promosaver.net</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Self-instantiate if loaded standalone
      if (!document.getElementById("beat-4-cta")) {
        const template = document.getElementById("beat-4-cta-template");
        if (template) {
          document.body.innerHTML += template.innerHTML;
        }
      }

      // Dynamic variables and timings
      const vars = (window.__variables && window.__variables.beat4) || {
        header: "CYBER-EXPOSURE SHIELD",
        buttonText: "Compare eSIM Free",
        url: "esim.promosaver.net"
      };
      const duration = (window.__timings && window.__timings.scene4.duration) || 3.7;

      // Populate layout dynamically
      const headerEl = document.querySelector("#beat-4-cta .header-text");
      if (headerEl) {
        // Find if we can split it to highlight the last word
        const words = vars.header.split(" ");
        if (words.length > 1) {
          const lastWord = words.pop();
          headerEl.innerHTML = `${words.join(" ")} <span class="brand-accent">${lastWord}</span>`;
        } else {
          headerEl.textContent = vars.header;
        }
      }

      const buttonEl = document.querySelector("#beat-4-cta .cta-button span");
      if (buttonEl) buttonEl.textContent = vars.buttonText;

      const urlEl = document.querySelector("#beat-4-cta .url-display");
      if (urlEl) urlEl.textContent = vars.url;

      const tl = gsap.timeline({ paused: true });

      const animDuration = Math.max(duration - 0.2, 1);
      tl.to("#beat-4-cta .glow-ring-large", { scale: 1.15, opacity: 0.09, duration: animDuration, yoyo: true, repeat: 0, ease: "sine.inOut" }, 0);
      tl.to("#beat-4-cta .content", { scale: 1.03, duration: animDuration, ease: "sine.inOut" }, 0);

      // Header text fade-in & slide down
      tl.from("#beat-4-cta .header-text", { y: -40, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.1);
      
      // Outro card pops in
      tl.from("#beat-4-cta .outro-card", { scale: 0.9, y: 50, opacity: 0, duration: 0.7, ease: "back.out(1.2)" }, 0.25);
      
      // CTA button pop
      tl.from("#beat-4-cta .cta-button", { scale: 0.8, opacity: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.5);

      // URL display typing simulation
      const urlText = vars.url;
      const urlObj = { charCount: 0 };
      tl.to(urlObj, {
        charCount: urlText.length,
        duration: 0.8,
        ease: "power2.out",
        onUpdate: function() {
          const el = document.querySelector("#beat-4-cta .url-display");
          if (el) {
            el.textContent = urlText.slice(0, Math.round(urlObj.charCount));
          }
        }
      }, 0.7);

      // End of compilation fade to black
      const fadeOutStart = Math.max(duration - 0.9, 1.8);
      tl.to("#beat-4-cta", { opacity: 0, scale: 1.02, filter: "blur(10px)", duration: 0.7, ease: "power2.in" }, fadeOutStart);

      window.__timelines["beat-4-cta"] = tl;
    </script>
  </div>
</template>
