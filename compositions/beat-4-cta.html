<template id="beat-4-cta-template">
  <div id="beat-4-cta" data-composition-id="beat-4-cta" data-width="1080" data-height="1920">
    <style>
      #beat-4-cta {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #030712;
      }
      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 120px 80px;
        position: relative;
        z-index: 10;
        text-align: center;
      }
      .header-text {
        font-family: sans-serif;
        font-weight: 800;
        font-size: 50px;
        color: #f1f5f9;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 80px;
      }
      .browser-preview {
        width: 100%;
        height: 600px;
        background: #0f172b;
        border: 2px solid #1d293d;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 60px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .browser-header {
        height: 40px;
        background: #1d293d;
        display: flex;
        align-items: center;
        padding: 0 15px;
        gap: 15px;
      }
      .browser-dots {
        display: flex;
        gap: 6px;
      }
      .b-dot {
        width: 10px;
        height: 10px;
        background: #475569;
        border-radius: 50%;
      }
      .browser-address {
        flex-grow: 1;
        background: #030712;
        border-radius: 6px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #90a1b9;
        font-family: monospace;
        font-size: 14px;
      }
      .browser-screen {
        width: 100%;
        height: calc(100% - 40px);
        overflow: hidden;
        position: relative;
      }
      .browser-screen img {
        width: 100%;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
      .cta-button {
        background: #000000;
        color: #ef4444;
        font-family: sans-serif;
        font-weight: 900;
        font-size: 28px;
        text-transform: uppercase;
        padding: 26px 48px;
        border-radius: 16px;
        border: none;
        box-shadow: rgba(239, 68, 68, 0.35) 0px 0px 30px 0px;
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 60px;
      }
      .arrow-icon {
        width: 32px;
        height: 32px;
        fill: #ef4444;
      }
      .url-display {
        font-family: monospace;
        font-size: 44px;
        font-weight: 700;
        color: #90a1b9;
        letter-spacing: -0.02em;
        border-bottom: 2px solid rgba(144, 161, 185, 0.3);
        padding-bottom: 8px;
      }
      .glow-green {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: #00bc7d;
        filter: blur(160px);
        opacity: 0.12;
        top: 20%;
        left: -100px;
        z-index: 1;
        pointer-events: none;
      }
      .glow-red {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: #ff1d58;
        filter: blur(160px);
        opacity: 0.12;
        bottom: 10%;
        right: -100px;
        z-index: 1;
        pointer-events: none;
      }
    </style>

    <div class="glow-green" data-layout-allow-overflow></div>
    <div class="glow-red" data-layout-allow-overflow></div>
    
    <div class="content" data-layout-allow-overflow>
      <div class="header-text">CYBER-EXPOSURE SHIELD</div>
      
      <!-- Top Browser preview showing website homepage in CTA -->
      <div class="browser-preview">
        <div class="browser-header">
          <div class="browser-dots"><span class="b-dot"></span><span class="b-dot"></span><span class="b-dot"></span></div>
          <div class="browser-address">website.com</div>
        </div>
        <div class="browser-screen">
          <img class="web-screenshot" src="capture/screenshots/scroll-000.png" alt="Website Screenshot" />
        </div>
      </div>
      
      <button class="cta-button">
        <span>Scan My Email Free</span>
        <img class="arrow-icon" src="capture/assets/svgs/lucide-arrow-right.svg" alt="Arrow" />
      </button>
      
      <div class="url-display">scan.promosaver.net</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Self-instantiate if loaded standalone (e.g. by the linter) so elements resolve
      if (!document.getElementById("beat-4-cta")) {
        const template = document.getElementById("beat-4-cta-template");
        if (template) {
          document.body.innerHTML += template.innerHTML;
        }
      }

      // Dynamic variables and timings
      const vars = (window.__variables && window.__variables.beat4) || {
        header: "CYBER-EXPOSURE SHIELD",
        buttonText: "Scan My Email Free",
        url: "scan.promosaver.net"
      };
      const duration = (window.__timings && window.__timings.scene4.duration) || 3.7;

      // Populate layout dynamically
      const headerEl = document.querySelector("#beat-4-cta .header-text");
      if (headerEl) headerEl.textContent = vars.header;

      const buttonEl = document.querySelector("#beat-4-cta .cta-button span");
      if (buttonEl) buttonEl.textContent = vars.buttonText;

      const urlEl = document.querySelector("#beat-4-cta .url-display");
      if (urlEl) urlEl.textContent = vars.url;

      // Address bar text (clean domain name)
      const addressBarEl = document.querySelector("#beat-4-cta .browser-address");
      if (addressBarEl) {
        addressBarEl.textContent = vars.url;
      }

      const tl = gsap.timeline({ paused: true });

      // Ambient glow breathing & slow dolly-in
      const animDuration = Math.max(duration - 0.2, 1);
      tl.to("#beat-4-cta .glow-green", { x: 50, y: -30, scale: 1.1, duration: animDuration, yoyo: true, repeat: 0, ease: "sine.inOut" }, 0);
      tl.to("#beat-4-cta .glow-red", { x: -50, y: 30, scale: 1.1, duration: animDuration, yoyo: true, repeat: 0, ease: "sine.inOut" }, 0);
      tl.to("#beat-4-cta .content", { scale: 1.05, duration: animDuration, ease: "sine.inOut" }, 0);

      // Browser preview entrance with spring/bounce
      tl.from("#beat-4-cta .browser-preview", { scale: 0.9, y: 50, opacity: 0, duration: 0.8, ease: "power2.out" }, 0);
      
      // Header text fade-in
      tl.from("#beat-4-cta .header-text", { y: -30, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.4);
      
      // CTA button slides in from bottom
      tl.from("#beat-4-cta .cta-button", { y: 60, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.7);

      // URL display typing simulation
      const urlText = vars.url;
      const urlObj = { charCount: 0 };
      
      tl.to(urlObj, {
        charCount: urlText.length,
        duration: 0.8,
        ease: "power1.inOut",
        onUpdate: function() {
          const el = document.querySelector("#beat-4-cta .url-display");
          if (el) {
            el.textContent = urlText.slice(0, Math.round(urlObj.charCount));
          }
        }
      }, 1.1);

      // End of compilation fade to black (last scene exception)
      const fadeOutStart = Math.max(duration - 0.9, 2.0);
      tl.to("#beat-4-cta", { opacity: 0, scale: 1.02, filter: "blur(10px)", duration: 0.7, ease: "power2.in" }, fadeOutStart);

      window.__timelines["beat-4-cta"] = tl;
    </script>
  </div>
</template>
