<template id="beat-2-problem-template">
  <div id="beat-2-problem" data-composition-id="beat-2-problem" data-width="1080" data-height="1920">
    <style>
      #beat-2-problem {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0D0E12;
      }
      .screenshot-bg-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        z-index: 1;
      }
      .web-screenshot {
        width: 1080px;
        height: 2500px; /* Tall image for scrolling */
        object-fit: cover;
        object-position: top center;
        position: absolute;
        top: 0;
        left: 0;
      }
      .scrim {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        background: linear-gradient(180deg, rgba(13, 14, 18, 0.5) 0%, rgba(13, 14, 18, 0.8) 50%, rgba(13, 14, 18, 0.95) 100%);
        z-index: 2;
      }
      .content {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        padding: 160px 80px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        z-index: 10;
      }
      .stat-card {
        width: 100%;
        background: rgba(15, 23, 43, 0.65);
        border: 2px solid rgba(29, 41, 61, 0.55);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 45px;
        margin-top: 50px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .stat-header {
        font-family: monospace;
        font-weight: 700;
        font-size: 24px;
        color: #FFE500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .stat-number {
        font-family: 'Outfit', sans-serif;
        font-weight: 900;
        font-size: 110px;
        color: #F8F9FA;
        line-height: 1;
        letter-spacing: -0.04em;
        text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        margin-bottom: 10px;
      }
      .stat-label {
        font-family: 'Outfit', sans-serif;
        font-size: 26px;
        color: #90A1B9;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: center;
        margin-bottom: 35px;
      }
      .comparison-rows {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .comp-row {
        font-family: 'Outfit', sans-serif;
        font-size: 26px;
        color: #F8F9FA;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed rgba(144, 161, 185, 0.2);
        padding-bottom: 10px;
      }
      .comp-row-value {
        font-weight: 900;
        color: #FFE500;
        text-shadow: 0 0 10px rgba(255, 229, 0, 0.2);
      }
      .glow-ring {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: #FFE500;
        filter: blur(180px);
        opacity: 0.06;
        bottom: 20%;
        right: -100px;
        z-index: 2;
        pointer-events: none;
      }
    </style>

    <div class="screenshot-bg-container" data-layout-allow-overflow>
      <img class="web-screenshot" src="capture/screenshots/scroll-000.png" alt="Website Screenshot" data-layout-allow-overflow />
      <div class="scrim"></div>
    </div>
    <div class="glow-ring" data-layout-allow-overflow></div>
    
    <div class="content" data-layout-allow-overflow>
      <div class="stat-card" data-layout-allow-overflow>
        <div class="stat-header">Database Exposure</div>
        <div class="stat-number"><span class="counter-num">0.0</span>B</div>
        <div class="stat-label">Compromised Indexes Loaded</div>
        <div class="comparison-rows">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      
      // Self-instantiate if loaded standalone
      if (!document.querySelector(".screenshot-bg-container")) {
        const template = document.getElementById("beat-2-problem-template");
        if (template) {
          document.body.innerHTML += template.innerHTML;
        }
      }

      const vars = (window.__variables && window.__variables.beat2) || {
        header: "Database Exposure",
        stat: "14.8",
        unit: "B",
        label: "Compromised Indexes Loaded",
        rows: [
          { email: "j.smi***@gmail.com", leak: "Adobe 153M" },
          { email: "admin@corporatelink.net", leak: "LinkedIn 164M" },
          { email: "t.jack***@yahoo.com", leak: "Yahoo 3B" },
          { email: "alex.v***@gmail.com", leak: "Canva 137M" }
        ]
      };
      const duration = (window.__timings && window.__timings.scene2.duration) || 3.7;

      // Populate layout dynamically
      const headerEl = document.querySelector("#beat-2-problem .stat-header");
      if (headerEl) headerEl.textContent = vars.header;

      const labelEl = document.querySelector("#beat-2-problem .stat-label");
      if (labelEl) labelEl.textContent = vars.label;

      const statNumberEl = document.querySelector("#beat-2-problem .stat-number");
      if (statNumberEl) {
        statNumberEl.innerHTML = `<span class="counter-num">0.0</span>${vars.unit}`;
      }

      const rowsContainer = document.querySelector("#beat-2-problem .comparison-rows");
      if (rowsContainer) {
        rowsContainer.innerHTML = "";
        // Take up to 4 rows for clean display
        vars.rows.slice(0, 4).forEach(row => {
          const rowEl = document.createElement("div");
          rowEl.className = "comp-row";
          rowEl.innerHTML = `<span>${row.email}</span><span class="comp-row-value">${row.leak}</span>`;
          rowsContainer.appendChild(rowEl);
        });
      }

      const tl = gsap.timeline({ paused: true });

      const animDuration = Math.max(duration - 0.2, 1);
      
      // Screenshot slow-scroll animation
      tl.fromTo("#beat-2-problem .web-screenshot", 
        { y: 0 },
        { y: -300, duration: animDuration, ease: "sine.inOut" }, 
        0
      );
      
      // Content container scale
      tl.to("#beat-2-problem .content", { scale: 1.02, duration: animDuration, ease: "sine.inOut" }, 0);

      // Card entrance animation
      tl.from("#beat-2-problem .stat-card", { 
        y: 100, 
        scale: 0.9, 
        opacity: 0, 
        duration: 0.7, 
        ease: "back.out(1.2)" 
      }, 0.15);

      // Numeric count-up
      const countObj = { val: 0.0 };
      const targetVal = parseFloat(vars.stat) || 0;
      tl.to(countObj, {
        val: targetVal,
        duration: Math.max(animDuration - 0.5, 0.8),
        ease: "power2.out",
        onUpdate: function() {
          const el = document.querySelector("#beat-2-problem .counter-num");
          if (el) el.textContent = countObj.val.toFixed(1);
        }
      }, 0.3);

      // Rows fade in stagger
      tl.from("#beat-2-problem .comp-row", { 
        opacity: 0, 
        y: 20, 
        duration: 0.4, 
        stagger: 0.1, 
        ease: "power2.out" 
      }, 0.45);

      window.__timelines["beat-2-problem"] = tl;
    </script>
  </div>
</template>
