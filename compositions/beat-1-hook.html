<template id="beat-1-hook-template">
  <div id="beat-1-hook" data-composition-id="beat-1-hook" data-width="1080" data-height="1920">
    <style>
      #beat-1-hook {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0D0E12;
      }
      .screenshot-bg-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .browser-mockup {
        width: 920px;
        height: 1100px;
        background: #0D0E12;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.05);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        z-index: 3;
        transform: translateY(220px);
      }
      .browser-bar {
        height: 52px;
        background: #16171D;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .browser-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .browser-dot.red { background: #EF4444; }
      .browser-dot.yellow { background: #F59E0B; }
      .browser-dot.green { background: #10B981; }
      .browser-address {
        flex-grow: 1;
        height: 32px;
        background: #0D0E12;
        border-radius: 6px;
        margin-left: 20px;
        margin-right: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 14px;
        color: #90A1B9;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .browser-content {
        flex-grow: 1;
        position: relative;
        overflow: hidden;
        background: #0D0E12;
      }
      .web-screenshot {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        transform: scale(1.05);
      }
      .scrim {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(circle at center, rgba(13, 14, 18, 0.1) 0%, rgba(13, 14, 18, 0.6) 60%, rgba(13, 14, 18, 0.95) 100%);
        z-index: 2;
      }
      .content {
        position: absolute;
        top: 250px;
        left: 0;
        width: 1080px;
        padding: 0 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 10;
      }
      .headline {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 80px;
        line-height: 1.1;
        color: #F8F9FA;
        text-transform: uppercase;
        letter-spacing: -0.03em;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }
      .headline span {
        display: block;
      }
      .highlight {
        color: #FFE500;
        text-shadow: 0 0 30px rgba(255, 229, 0, 0.5);
      }
      .glow-ring {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: #FFE500;
        filter: blur(180px);
        opacity: 0.08;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
      }
    </style>

    <div class="screenshot-bg-container" data-layout-allow-overflow>
      <div class="browser-mockup">
        <div class="browser-bar">
          <span class="browser-dot red"></span>
          <span class="browser-dot yellow"></span>
          <span class="browser-dot green"></span>
          <div class="browser-address">scan.promosaver.net</div>
        </div>
        <div class="browser-content">
          <img class="web-screenshot" src="capture/screenshots/scroll-000.png" alt="Website Screenshot" data-layout-allow-overflow />
        </div>
      </div>
      <div class="scrim"></div>
    </div>
    <div class="glow-ring" data-layout-allow-overflow></div>
    
    <div class="content" data-layout-allow-overflow>
      <h1 class="headline">
        <!-- Spans generated dynamically below -->
      </h1>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      
      // Self-instantiate if loaded standalone
      if (!document.querySelector(".screenshot-bg-container")) {
        const template = document.getElementById("beat-1-hook-template");
        if (template) {
          document.body.innerHTML += template.innerHTML;
        }
      }

      const vars = (window.__variables && window.__variables.beat1) || {
        title: "Is Your Password Exposed?",
        highlight: "Exposed?"
      };
      const duration = (window.__timings && window.__timings.scene1.duration) || 3.7;

      // Populate headline dynamically
      const headlineEl = document.querySelector("#beat-1-hook .headline");
      if (headlineEl) {
        headlineEl.innerHTML = "";
        const words = vars.title.split(" ");
        words.forEach((word, index) => {
          const span = document.createElement("span");
          span.textContent = word;
          span.className = `word-${index + 1}`;
          if (vars.highlight && word.toLowerCase().includes(vars.highlight.toLowerCase())) {
            span.classList.add("highlight");
          }
          headlineEl.appendChild(span);
          headlineEl.appendChild(document.createTextNode(" "));
        });
      }

      // Populate mock browser address dynamically
      const addressEl = document.querySelector("#beat-1-hook .browser-address");
      if (addressEl) {
        addressEl.textContent = (window.__variables && window.__variables.beat4 && window.__variables.beat4.url) || "scan.promosaver.net";
      }

      const tl = gsap.timeline({ paused: true });

      // Slow Ken Burns dolly-in on screenshot
      const animDuration = Math.max(duration - 0.2, 1);
      tl.fromTo("#beat-1-hook .web-screenshot", 
        { scale: 1.05, y: 0 },
        { scale: 1.15, y: -40, duration: animDuration, ease: "sine.inOut" }, 
        0
      );
      
      // Scale dynamic elements
      tl.to("#beat-1-hook .content", { scale: 1.03, duration: animDuration, ease: "sine.inOut" }, 0);
      
      // Dynamically animate words sliding/fading in
      const words = vars.title.split(" ");
      words.forEach((word, index) => {
        const selector = `#beat-1-hook .word-${index + 1}`;
        const startTime = 0.3 + index * 0.15;
        if (index === words.length - 1 || word.toLowerCase().includes(vars.highlight.toLowerCase())) {
          tl.from(selector, { opacity: 0, scale: 0.8, y: 50, duration: 0.6, ease: "back.out(2.0)", overwrite: "auto" }, startTime);
        } else {
          tl.from(selector, { opacity: 0, y: 35, duration: 0.4, ease: "power2.out", overwrite: "auto" }, startTime);
        }
      });

      window.__timelines["beat-1-hook"] = tl;
    </script>
  </div>
</template>
