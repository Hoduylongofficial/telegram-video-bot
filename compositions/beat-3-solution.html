    <div class="content" data-layout-allow-overflow>
      <!-- Top Browser preview showing website secondary page/tool -->

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Self-instantiate if loaded standalone (e.g. by the linter) so elements resolve
      if (!document.getElementById("beat-3-solution")) {
        const template = document.getElementById("beat-3-solution-template");
        if (template) {
          document.body.innerHTML += template.innerHTML;
        }
      }

      // Dynamic variables and timings
      const vars = (window.__variables && window.__variables.beat3) || {
        header: "Cryptographic Check",
        email: "demo@corporatelink.net",
        hash: "5e883f98892919347d1756228466bb414b490d4684504121ec37f14302c44186",
        badge: "Zero Logs Policy Verified"
      };
      const duration = (window.__timings && window.__timings.scene3.duration) || 5.1;

      // Populate layout dynamically
      const headerEl = document.querySelector("#beat-3-solution .header-text");
      if (headerEl) headerEl.textContent = vars.header;

      const hashValueEl = document.querySelector("#beat-3-solution .hash-value");
      if (hashValueEl) hashValueEl.textContent = vars.hash;

      const badgeEl = document.querySelector("#beat-3-solution .status-badge span");
      if (badgeEl) badgeEl.textContent = vars.badge;

      // Address bar text (clean domain name)
      const addressBarEl = document.querySelector("#beat-3-solution .browser-address");
      if (addressBarEl && window.__variables && window.__variables.beat4) {
        addressBarEl.textContent = window.__variables.beat4.url || "website.com";
      } else if (addressBarEl) {
        addressBarEl.textContent = "promosaver.net";
      }

      const tl = gsap.timeline({ paused: true });

      // Ambient glow breathing & slow dolly-out
      const animDuration = Math.max(duration - 0.4, 1);
      tl.to("#beat-3-solution .glow", { scale: 1.2, opacity: 0.2, duration: animDuration, yoyo: true, repeat: 0, ease: "sine.inOut" }, 0);
      tl.to("#beat-3-solution .content", { scale: 0.98, duration: animDuration, ease: "sine.inOut" }, 0);
      tl.to("#beat-3-solution .web-screenshot", { y: "-30%", duration: animDuration, ease: "power1.inOut" }, 0);

      // Entrances
      tl.from("#beat-3-solution .browser-preview", { y: -40, opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      tl.from("#beat-3-solution .header-text", { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from("#beat-3-solution .panel-card", { y: 50, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.3);

      // Typing simulation
      const textVal = vars.email;
      const typeObj = { charCount: 0 };
      const typingDuration = Math.min(1.2, animDuration * 0.35);
      const typingStart = 0.5;
      const typingEnd = typingStart + typingDuration;
      
      tl.to(typeObj, {
        charCount: textVal.length,
        duration: typingDuration,
        ease: "none",
        onUpdate: function() {
          const el = document.querySelector("#beat-3-solution .input-placeholder");
          if (el) {
            el.textContent = textVal.slice(0, Math.round(typeObj.charCount));
          }
        }
      }, typingStart);

      // Blink cursor
      const blinkCount = Math.ceil(animDuration / 0.4);
      tl.to("#beat-3-solution .cursor", { opacity: 0, duration: 0.4, repeat: blinkCount, yoyo: true, ease: "steps(1)" }, 0.5);

      // Fade in encryption / hash display
      tl.to("#beat-3-solution .encryption-display", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, typingEnd);

      // Badge snaps in
      const badgeTime = typingEnd + 0.4;
      tl.fromTo("#beat-3-solution .status-badge", 
        { scale: 0.8, opacity: 0 }, 
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 
        badgeTime
      );

      window.__timelines["beat-3-solution"] = tl;
    </script>
