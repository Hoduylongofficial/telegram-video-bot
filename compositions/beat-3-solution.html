<template id="beat-3-solution-template">
  <div id="beat-3-solution" data-composition-id="beat-3-solution" data-width="1080" data-height="1920">
    <style>
      #beat-3-solution {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0D0E12;
      }
      .screenshot-bg-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .browser-mockup {
        width: 920px;
        height: 1100px;
        background: #0D0E12;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.05);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        z-index: 3;
        transform: translateY(220px);
      }
      .browser-bar {
        height: 52px;
        background: #16171D;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .browser-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .browser-dot.red { background: #EF4444; }
      .browser-dot.yellow { background: #F59E0B; }
      .browser-dot.green { background: #10B981; }
      .browser-address {
        flex-grow: 1;
        height: 32px;
        background: #0D0E12;
        border-radius: 6px;
        margin-left: 20px;
        margin-right: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 14px;
        color: #90A1B9;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .browser-content {
        flex-grow: 1;
        position: relative;
        overflow: hidden;
        background: #0D0E12;
      }
      .web-screenshot {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        transform: scale(1.1);
      }
      .scrim {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(circle at center, rgba(13, 14, 18, 0.1) 0%, rgba(13, 14, 18, 0.6) 60%, rgba(13, 14, 18, 0.95) 100%);
        z-index: 2;
      }
      .content {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        padding: 160px 80px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        z-index: 10;
      }
      .header-text {
        font-family: monospace;
        font-weight: 700;
        font-size: 24px;
        color: #FFE500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 25px;
      }
      .verification-card {
        width: 100%;
        background: rgba(15, 23, 43, 0.7);
        border: 2px solid rgba(0, 243, 255, 0.4);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 45px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.15);
        display: flex;
        flex-direction: column;
        gap: 25px;
        margin-top: 50px;
      }
      .info-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .info-label {
        font-family: monospace;
        font-size: 18px;
        color: #90A1B9;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .info-value {
        font-family: 'Outfit', sans-serif;
        font-size: 32px;
        font-weight: 900;
        color: #F8F9FA;
        letter-spacing: -0.01em;
      }
      .info-value.monospace-val {
        font-family: monospace;
        font-size: 28px;
        background: rgba(3, 7, 18, 0.4);
        padding: 15px;
        border-radius: 8px;
        word-break: break-all;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .status-badge {
        background: rgba(0, 243, 255, 0.1);
        border: 1px solid #00F3FF;
        border-radius: 8px;
        padding: 12px 25px;
        align-self: center;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        margin-top: 10px;
      }
      .status-badge span {
        font-family: monospace;
        font-size: 24px;
        color: #00F3FF;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .glow-ring {
        position: absolute;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: #00F3FF;
        filter: blur(180px);
        opacity: 0.06;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
      }
    </style>

    <div class="screenshot-bg-container" data-layout-allow-overflow>
      <div class="browser-mockup">
        <div class="browser-bar">
          <span class="browser-dot red"></span>
          <span class="browser-dot yellow"></span>
          <span class="browser-dot green"></span>
          <div class="browser-address">scan.promosaver.net</div>
        </div>
        <div class="browser-content">
          <img class="web-screenshot" src="capture/screenshots/scroll-100.png" onerror="this.src='capture/screenshots/scroll-000.png'" alt="Website Screenshot" data-layout-allow-overflow />
        </div>
      </div>
      <div class="scrim"></div>
    </div>
    <div class="glow-ring" data-layout-allow-overflow></div>
    
    <div class="content" data-layout-allow-overflow>
      <div class="verification-card" data-layout-allow-overflow>
        <div class="stat-header" style="display:none;"></div>
        <div class="header-text">Cryptographic Check</div>
        
        <div class="info-row">
          <div class="info-label">Active Feature</div>
          <div class="info-value input-field">eSIM QR Scanner</div>
        </div>

        <div class="info-row">
          <div class="info-label">Status Details</div>
          <div class="info-value monospace-val result-detail">5e883f98892919347...</div>
        </div>

        <div class="status-badge">
          <span>Zero Logs Policy Verified</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      
      // Self-instantiate if loaded standalone
      if (!document.getElementById("beat-3-solution")) {
        const template = document.getElementById("beat-3-solution-template");
        if (template) {
          document.body.innerHTML += template.innerHTML;
        }
      }

      // Dynamic variables and timings
      const vars = (window.__variables && window.__variables.beat3) || {
        header: "Cryptographic Check",
        email: "eSIM QR Scanner",
        hash: "5e883f98892919347d1756228466bb414b490d4684504121ec37f14302c44186",
        badge: "Zero Logs Policy Verified"
      };
      const duration = (window.__timings && window.__timings.scene3.duration) || 5.1;

      // Populate layout dynamically
      const headerEl = document.querySelector("#beat-3-solution .header-text");
      if (headerEl) headerEl.textContent = vars.header;

      const inputFieldEl = document.querySelector("#beat-3-solution .input-field");
      if (inputFieldEl) inputFieldEl.textContent = vars.email;

      const resultDetailEl = document.querySelector("#beat-3-solution .result-detail");
      if (resultDetailEl) {
        // Truncate hashes if too long for nice layout
        if (vars.hash.length > 28) {
          resultDetailEl.textContent = vars.hash.slice(0, 18) + "..." + vars.hash.slice(-8);
        } else {
          resultDetailEl.textContent = vars.hash;
        }
      }

      const badgeEl = document.querySelector("#beat-3-solution .status-badge span");
      if (badgeEl) badgeEl.textContent = vars.badge;

      // Populate mock browser address dynamically
      const addressEl = document.querySelector("#beat-3-solution .browser-address");
      if (addressEl) {
        addressEl.textContent = (window.__variables && window.__variables.beat4 && window.__variables.beat4.url) || "scan.promosaver.net";
      }

      const tl = gsap.timeline({ paused: true });

      const animDuration = Math.max(duration - 0.2, 1);
      
      // Focal zoom on screenshot background
      tl.fromTo("#beat-3-solution .web-screenshot", 
        { scale: 1.1, x: 0, y: 0 },
        { scale: 1.55, x: -80, y: -90, duration: animDuration, ease: "power2.inOut" }, 
        0
      );
      
      // Scale content wrapper
      tl.to("#beat-3-solution .content", { scale: 0.98, duration: animDuration, ease: "sine.inOut" }, 0);

      // Card entrance animation
      tl.from("#beat-3-solution .verification-card", { 
        y: 80, 
        scale: 0.92, 
        opacity: 0, 
        duration: 0.8, 
        ease: "back.out(1.2)" 
      }, 0.15);

      // Stagger animate all info rows cleanly
      tl.from("#beat-3-solution .info-row", {
        opacity: 0,
        x: -20,
        duration: 0.4,
        stagger: 0.2,
        ease: "power2.out"
      }, 0.4);

      // Status badge pop in
      tl.fromTo("#beat-3-solution .status-badge",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2.0)" },
        0.9
      );

      window.__timelines["beat-3-solution"] = tl;
    </script>
  </div>
</template>
